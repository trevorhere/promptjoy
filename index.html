<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to PromptJoy. Let's talk.">
    <title>PromptJoy</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #000;
            color: #fff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(100%, 420px);
        }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(1.2rem, 4vw, 1.65rem);
            font-weight: 500;
            line-height: 1.35;
            letter-spacing: 0;
            text-transform: lowercase;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d4d4d4;
            font-size: 0.95rem;
        }

        .form-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        input {
            width: 100%;
            min-width: 0;
            height: 52px;
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
            background: #050505;
            color: #fff;
            padding: 0 16px;
            font: inherit;
        }

        input::placeholder {
            color: #777;
        }

        input:focus {
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.14);
        }

        input[aria-invalid="true"] {
            border-color: #ff6b6b;
        }

        button {
            flex: 0 0 auto;
            height: 52px;
            border: 1px solid #fff;
            border-radius: 8px;
            background: #fff;
            color: #000;
            padding: 0 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #e8e8e8;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .status {
            min-height: 24px;
            margin: 12px 0 0;
            color: #bdbdbd;
            font-size: 0.95rem;
        }

        .status.error {
            color: #ff8a8a;
        }

        .status.success {
            color: #d8ffd8;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            main {
                width: 100%;
            }

            .form-row {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main aria-labelledby="welcome-title">
        <h1 id="welcome-title">welcome to promptjoy</h1>
        <form id="contact-form" novalidate>
            <p class="hidden">
                <label>Do not fill this out: <input name="website" tabindex="-1" autocomplete="off"></label>
            </p>
            <label for="email">let's talk:</label>
            <div class="form-row">
                <input id="email" name="email" type="email" placeholder="email@example.com" autocomplete="email" inputmode="email" maxlength="254" aria-describedby="form-status" required>
                <button id="submit-button" type="submit">send</button>
            </div>
            <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const form = document.querySelector("#contact-form");
        const emailInput = document.querySelector("#email");
        const status = document.querySelector("#form-status");
        const submitButton = document.querySelector("#submit-button");

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function setStatus(message, type) {
            status.textContent = message;
            status.className = type ? `status ${type}` : "status";
        }

        function normalizeEmail(value) {
            return value.trim().toLowerCase();
        }

        function isValidEmail(value) {
            return value.length > 0 && value.length <= 254 && emailPattern.test(value);
        }

        emailInput.addEventListener("input", () => {
            emailInput.setAttribute("aria-invalid", "false");
            setStatus("", "");
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = normalizeEmail(emailInput.value);

            if (!isValidEmail(email)) {
                emailInput.setAttribute("aria-invalid", "true");
                emailInput.focus();
                setStatus("enter a valid email address.", "error");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "sending";
            setStatus("", "");

            try {
                const response = await fetch("/api/contact", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        website: form.elements.website.value
                    })
                });

                if (!response.ok) {
                    let message = "couldn't send that. email hello@promptjoy.co.";

                    try {
                        const body = await response.json();
                        if (body && body.error === "invalid_email") {
                            message = "enter a valid email address.";
                        }
                    } catch {
                        // Keep the generic fallback.
                    }

                    throw new Error(message);
                }

                form.reset();
                emailInput.setAttribute("aria-invalid", "false");
                setStatus("thanks, i'll be in touch.", "success");
            } catch (error) {
                setStatus(error.message || "couldn't send that. email hello@promptjoy.co.", "error");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "send";
            }
        });
    </script>
</body>
</html>
